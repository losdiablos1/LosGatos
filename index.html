<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alegrómetro</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1530;--surface:#2A2147;--ink:#F6F1FF;--muted:#b3a5d6;--accent:#FF5C7A;--sun:#FFC933;--line:#3d3266}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-size:18px;line-height:1.35;transition:background .25s}
body.white{--bg:#fff;--ink:#222;--muted:#666;--surface:#f4f4f4;--line:#ddd}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:2.6rem;font-weight:800;margin:6px 0 2px}
section{display:none}
section.on{display:block}
input[type=text]{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);width:100%;margin-top:10px}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* LISTA */
.add{display:flex;gap:8px;margin-bottom:18px}
.add input{flex:1}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{position:relative}
.chip{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;color:var(--ink);min-height:74px;display:flex;flex-direction:column;justify-content:space-between}
.chip .n{font-size:1.15rem;word-break:break-word;padding-right:18px}
.chip .p{font-size:.95rem;color:var(--muted);font-weight:500}
.del{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;background:transparent;color:var(--muted);font-size:1.1rem}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:24px 0}
.back{background:transparent;color:var(--muted);padding:6px 0;margin-bottom:6px}
.face{font-size:7rem;text-align:center;line-height:1}

/* ===== 2. PANTALLA DE CANTIDAD (estilo captura) ===== */
body.pay main{padding:0;max-width:440px}
.payapp{
  /* ===== COLORES: cambia aquí ===== */
  --morado:#77069A;      /* franja, número de arriba y monto */
  --gris:#E4E4EA;        /* fondo del teclado y botón apagado */
  --gris-txt:#A9A9B8;    /* letras grises */
  --pildora:#F4F3FA;     /* fondo del Límite */
  --oscuro:#2B2650;      /* flechas y textos oscuros */
  min-height:100dvh;display:flex;flex-direction:column;background:#fff;color:var(--oscuro);font-family:'Roboto',system-ui,sans-serif;position:relative}
.pband{height:calc(env(safe-area-inset-top,0px) + 24px);background:var(--morado);flex:none}
.ptop{display:flex;justify-content:space-between;padding:12px 18px 0;flex:none}
.ptop button{background:none;padding:6px;color:var(--oscuro);display:grid;place-items:center}
.ptop svg{width:26px;height:26px}
.ptit{text-align:center;color:var(--morado);font-size:1.6rem;font-weight:500;margin:26px 0 0;min-height:2em}
.monto{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:auto;font-size:4.6rem;color:var(--morado);line-height:1.1}
.monto .pre{font-size:2.4rem;color:var(--gris-txt)}
.monto .cur{width:2px;height:.95em;background:var(--gris-txt);margin-left:-6px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.limite{align-self:center;width:72%;margin-top:12px;background:var(--pildora);border-radius:99px;padding:9px 18px;color:#5c5878;font-size:1.05rem;transition:background .2s,color .2s}
.limite.err{background:#FFE1E6;color:#C21F40}
.mensaje{margin:auto 5% 0;border:0;border-bottom:1px solid #DADAE2;border-radius:0;background:transparent;text-align:center;font-size:1.35rem;color:var(--oscuro);padding:14px 8px;font-family:inherit}
.mensaje::placeholder{color:var(--gris-txt)}
.pbtns{display:flex;gap:16px;padding:18px 4% 20px;flex:none}
.pbtns button{flex:1;height:58px;border-radius:12px;padding:0;font-family:inherit;font-size:1.05rem;font-weight:500}
.p-out{background:#fff;border:2px solid #E1E1EA;color:var(--oscuro)}
.p-fill{background:var(--gris);color:var(--gris-txt)}
.p-fill.ok{background:var(--morado);color:#fff}
.teclado{flex:none;background:var(--gris);border-radius:36px 36px 0 0;padding:12px 6px calc(env(safe-area-inset-bottom,0px) + 34px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teclado button{height:58px;border-radius:9px;background:#fff;color:#000;padding:0;font-family:inherit;font-size:2rem;font-weight:400;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.teclado button small{font-size:.62rem;letter-spacing:.2em;font-weight:500;margin-top:2px}
.teclado button.vacio{background:transparent;box-shadow:none;pointer-events:none}
.teclado button.borrar{background:transparent;box-shadow:none}
.teclado button.borrar svg{width:36px;height:28px}
.teclado button:active{background:#d2d2da}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== 3. RESULTADO (igual a la referencia) ===== */
body.fin{--bg:#660185}
body.fin main{padding:0;max-width:440px}
.fin-app{
  /* ===== COLORES: cambia aquí ===== */
  --fondo:#660185;       /* fondo morado */
  --numero:#3B3560;      /* número grande */
  --fecha:#6B6A80;       /* fecha y hora */
  min-height:100dvh;background:var(--fondo);color:#fff;font-family:'Roboto',system-ui,sans-serif;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 50px) 3.7% calc(env(safe-area-inset-bottom,0px) + 60px)}
.banner{position:relative;aspect-ratio:1097/470;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#8a2fa8,#5a0070);display:grid;place-items:center}
.banner .face{font-size:5rem}
.banner .imgres{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.x{position:absolute;top:5.3%;right:0;width:11.6%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;padding:0;display:grid;place-items:center}
.x svg{width:42%;height:42%}
.tarjeta{container-type:inline-size;background:#fff;border-radius:18px;margin-top:7px;overflow:hidden}
.tc{position:relative;aspect-ratio:1097/1056;width:100%}
.img-fondo-tc{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
.monto3{position:absolute;left:12.9%;top:15%;background:none;border-radius:0;padding:0;color:var(--numero);font-family:inherit;font-size:12.7cqw;font-weight:500;line-height:1;text-align:left;display:flex;align-items:baseline;gap:2cqw;z-index:2}
.pre3{font-size:.6em}
.fh{position:absolute;left:4.2%;top:41.4%;transform:translateY(-50%);display:flex;align-items:center;gap:1.3cqw;font-size:3.6cqw;font-weight:500;color:var(--fecha);z-index:2}
.fh svg{width:3.9cqw;height:3.9cqw;flex:none}
.sep{width:1px;height:3.4cqw;background:#9a99aa;margin:0 1.2cqw}
.masen{margin-top:12px}
.masen[hidden],.masen h3[hidden]{display:none}
.masen h3{margin:0 0 10px;font-size:1.3rem;font-family:inherit}
.tag{background:#F4B400;color:#222;font-size:.8rem;padding:3px 8px;border-radius:6px}
.imgfin{display:block;width:108.1%;margin-left:-4.05%;height:auto;cursor:pointer}
.imgres{max-height:70px;max-width:80%;object-fit:contain}
.bounce{animation:bounce .9s ease-out}
@keyframes bounce{0%{transform:translateY(-60px) scale(.6);opacity:0}55%{transform:translateY(8px) scale(1.1);opacity:1}80%{transform:translateY(-6px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.bounce,.shake,.cur{animation:none}}

/* ===== 1. INICIO ===== */
.homeapp{
  --fondo:#77069A;--cuadro:#FFFFFF;--rosa:#F4D6FB;--turquesa:#0BC9B0;--icono:#77069A;--texto:#3A3A48;
  position:relative;width:100%;height:min(880px,100dvh);background:var(--fondo);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;font-family:'Roboto',system-ui,sans-serif;color:#fff}
body.home main{padding:0;max-width:440px}
@media (max-width:480px){.homeapp{border-radius:0}}
.top{flex:none;padding:22px 16px 0}
.bar1{display:flex;gap:10px;align-items:center}
.circ{width:42px;height:42px;border-radius:50%;padding:0;background:rgba(255,255,255,.18);color:#fff;flex:none;display:grid;place-items:center}
.circ svg{width:20px;height:20px}
.pillwrap{flex:1;position:relative;display:flex;align-items:center;height:42px;border-radius:99px;background:rgba(255,255,255,.22)}
.pillwrap svg{position:absolute;left:14px;width:18px;height:18px;color:rgba(255,255,255,.85);pointer-events:none}
.pill{width:100%;height:100%;border-radius:99px;border:0;background:transparent;color:#fff;padding:0 16px 0 42px;font-family:inherit}
.pill::placeholder{color:rgba(255,255,255,.75)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;margin-top:18px}
.celda{background:none;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit}
.sq{width:100%;max-width:72px;aspect-ratio:1;border-radius:30%;background:var(--cuadro);display:grid;place-items:center;font-size:2rem;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.sq.mas{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#f9a8e8,#6d5cff) border-box;color:#6d5cff;font-size:2.4rem;font-weight:700}
.lab{font-size:.72rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1em}
.carrusel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.rcard{flex:none;width:82%;aspect-ratio:2.2;background:var(--rosa);color:var(--icono);border-radius:22px;scroll-snap-align:start;display:flex;align-items:center;gap:14px;padding:0 20px;font-weight:700;font-size:1.05rem}
.rcard .em{font-size:2.6rem}
.dots{display:flex;justify-content:center;gap:8px;padding:10px 0 12px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);transition:width .2s}
.dots i.on{width:34px;background:#fff}
.sheet{flex:1;min-height:0;background:#fff;border-radius:26px 26px 0 0;padding:14px 14px 0;display:flex;flex-direction:column;color:var(--texto)}
.row{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:16px;margin-bottom:12px;color:var(--texto);font-family:inherit;font-weight:500;text-align:left}
.row .ic{font-size:1.4rem;display:inline-flex}
.row .ic svg{width:22px;height:22px}
.row .chev{margin-left:auto;color:#888;transition:transform .2s;display:inline-flex}
.row .chev svg{width:18px;height:18px}
.row.abierto .chev{transform:rotate(180deg)}
.panel{display:none;padding:0 8px 8px;font-size:.92rem}
.panel.on{display:block}
.panel p{margin:4px 0}
.rank{flex:1;min-height:0;overflow-y:auto;padding:4px 6px}
.rank h3{font-size:1rem;margin:6px 0}
.rank .r{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #EDEDF0}
.rank .vacio{color:#999;text-align:center;margin-top:30px}
.botones{display:flex;gap:14px;padding:12px 0 18px;border-top:1px solid #f0f0f4}
.b-out,.b-fill{flex:1;height:52px;border-radius:14px;padding:0;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.b-out svg,.b-fill svg{width:20px;height:20px}
.b-out{background:#fff;border:2px solid var(--turquesa);color:var(--turquesa)}
.b-fill{background:var(--turquesa);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<main>

<!-- 1. INICIO -->
<section id="s0" class="on">
  <div class="homeapp">
    <div class="top">
      <div class="bar1">
        <button class="circ" id="btnPerfil" aria-label="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg></button>
        <div class="pillwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="buscar" class="pill" type="text" aria-label="Buscar"></div>
        <button class="circ" id="btnAyuda" aria-label="Ayuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="14" width="4.5" height="6.5" rx="1.4"/><rect x="17.5" y="14" width="4.5" height="6.5" rx="1.4"/></svg></button>
        <button class="circ" id="btnCampana" aria-label="Avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="carrusel" id="carrusel"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="sheet">
      <button class="row" id="rowOjo"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span><span id="txtOjo"></span></button>
      <button class="row" id="rowLibro"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span id="txtLibro"></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button>
      <div class="panel" id="panel"></div>
      <div class="rank" id="rank"></div>
      <div class="botones">
        <button class="b-out" id="btnLista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg><span id="txtBtn1"></span></button>
        <button class="b-fill" id="btnJugar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg><span id="txtBtn2"></span></button>
      </div>
    </div>
  </div>
</section>

<!-- LISTA (extra) -->
<section id="s1">
  <button class="back" id="volverInicio">← Inicio</button>
  <h1>Elige a alguien</h1>
  <div class="add">
    <input id="nuevo" type="text" maxlength="24" placeholder="Nombre o código" aria-label="Nombre o código">
    <button id="btnAdd">Agregar</button>
  </div>
  <div id="lista" class="list"></div>
</section>

<!-- 2. CANTIDAD (estilo captura) -->
<section id="s2">
  <div class="payapp">
    <div class="pband"></div>
    <div class="ptop">
      <button id="volverLista" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></button>
      <button id="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="ptit" id="arriba"></div>
    <div class="monto" id="monto"><span class="pre" id="pre"></span><span id="montoTxt">0</span><i class="cur"></i></div>
    <div class="limite" id="limite"></div>
    <input id="mensaje" class="mensaje" type="text" maxlength="40" aria-label="Mensaje">
    <div class="pbtns">
      <button class="p-out" id="pBtn1"></button>
      <button class="p-fill" id="btnRes"></button>
    </div>
    <div class="teclado" id="teclado"></div>
  </div>
</section>

<!-- 3. RESULTADO (igual a la referencia) -->
<section id="s3">
  <div class="fin-app">
    <div class="banner">
      <img id="imgArriba" class="imgres bounce" hidden alt="" referrerpolicy="no-referrer">
      <button class="x" id="cerrar3" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="tarjeta">
      <div class="tc">

        <button class="monto3" id="monto3" aria-label="Cambiar la cantidad"><span class="pre3" id="pre3"></span><span id="val3">0</span></button>
        <div class="fh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="fecha"></span><span class="sep"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="hora"></span>
        </div>
      </div>
    </div>
    <div class="masen" id="masen" hidden>
      <h3 id="masH"><span id="txtMas"></span><span class="tag" id="txtTag"></span></h3>
      <img id="imgAbajo" class="imgfin" data-caja="masen" hidden alt="" referrerpolicy="no-referrer">
    </div>
    <!-- Guardado para la pantalla final (por ahora oculto) -->
    <div id="reserva" hidden>
      <div id="tit3"></div><div id="nom3"></div>
      <button id="compartir"><span id="txtComp"></span></button>
      <span id="lbCod"></span><button id="info">i</button><div id="cajas"></div>
      <div id="lbDatos"></div><div id="datos"></div>
      <button id="otro"><span id="txtNuevo"></span></button>
      <button id="ayuda3"><span id="txtAyuda"></span></button>
    </div>
  </div>
</section>

</main>

function render(){

  if(!data.items.length){L.appendChild(mk('div','empty','Todavía no hay nadie. Agrega un nombre o código.'));return;}
  data.items.forEach(function(it,i){
    var w=mk('div','cell');
    var b=mk('button','chip');
    b.appendChild(mk('span','n',it.e+' '+it.n));
    b.appendChild(mk('span','p',it.p===null?'Sin medir':face(it.p)+' '+it.p+'%'));
    b.onclick=function(){abrir(i)};
    var x=mk('button','del','×');x.setAttribute('aria-label','Borrar '+it.n);
    x.onclick=function(){data.items.splice(i,1);save();render();};
    w.appendChild(b);w.appendChild(x);L.appendChild(w);
  });
}

/* ---------- IMÁGENES SEGÚN EL NÚMERO ---------- */
function ponerImg(id,lista,v,carita,resp){
  var el=$(id),url='',caja=el.dataset.caja?$(el.dataset.caja):null;
  for(var i=0;i<lista.length;i++){if(v<=lista[i].hasta){url=lista[i].img||'';break;}}
  function fin(ok){el.hidden=!ok;if(caja)caja.hidden=!ok;if(carita)carita.hidden=ok;}
  if(url){
    el.onerror=function(){
      if(resp&&el.src!==resp){el.src=resp;}
      else{fin(false);toast('No cargó la imagen 🖼️ revisa el link');}
    };
    el.src=url;fin(true);
  }else{el.removeAttribute('src');fin(false);}
}

function resultado(){
  if(val===''){toast('Escribe un número primero');return;}

  var it=data.items[cur];it.p=v;save();
  $('nom3').textContent=it.e+' '+it.n;
  $('pre3').textContent=F.prefijo3||'';
  var t=F.titulos[F.titulos.length-1].t;
  for(var i=0;i<F.titulos.length;i++){if(v<=F.titulos[i].hasta){t=F.titulos[i].t;break;}}
  $('tit3').textContent=t;
  var ahora=new Date();
  $('fecha').textContent=ahora.toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'});
  $('hora').textContent=ahora.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  var C=$('cajas');C.textContent='';
  for(var j=0;j<3;j++)C.appendChild(mk('span','caja',String(Math.floor(Math.random()*10))));
  var nv=v<F.cortes[0]?'bajo':v<F.cortes[1]?'medio':'alto';
  var D=$('datos');D.textContent='';
  F.filas.forEach(function(f){var r=mk('div','dato');r.appendChild(mk('span','',f.etiqueta));r.appendChild(mk('b','',pick(f[nv])));D.appendChild(r);});
  ponerImg('imgArriba',CONFIG.bannerFijo?[{hasta:100,img:CONFIG.bannerFijo}]:CONFIG.imagenes.arriba,v,null);
  ponerImg('imgAbajo',CONFIG.imagenAbajo?[{hasta:100,img:CONFIG.imagenAbajo}]:CONFIG.imagenes.abajo,v,null,CONFIG.imagenAbajoRespaldo);
  $('val3').textContent='0';
  show('s3');
  var t0=null;
  function step(ts){if(!t0)t0=ts;var k=Math.min((ts-t0)/1400,1);$('val3').textContent=Math.round(v*k);if(k<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
